name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run local site audit
        run: python scripts/site_audit.py

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Build explicit Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public
          mkdir -p public
          cp -R assets public/
          cp -R services public/
          cp -R data public/
          if [ -d downloads ]; then cp -R downloads public/; fi
          find . -maxdepth 1 -type f \( -name '*.html' -o -name '*.xml' -o -name '*.txt' -o -name '*.csv' \) -exec cp {} public/ \;
          touch public/.nojekyll
          test -f public/quick-fit.html
          test -f public/fit-check.html
          test -f public/tco-calculator.html
          test -f public/manufacturing-software-requirements-checklist.html
          test -f public/metal-fabrication-mrp.html
          test -f public/advisor-partners.html
          test -f public/vendor-partners.html
          test -f public/services/software-fit-diagnostic.html
          test -f public/data/fit-model-v1.json
          test -f public/googlea4b5334b8d3b78e4.html
          test "$(tr -d '\r\n' < public/googlea4b5334b8d3b78e4.html)" = "google-site-verification: googlea4b5334b8d3b78e4.html"
          find public -maxdepth 3 -type f | sort
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy
        id: deployment
        env:
          NODE_OPTIONS: --use-system-ca
        uses: actions/deploy-pages@v4

  report-success:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Record first successful deployment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title='[Automation] Initial GitHub Pages deployment succeeded'
          existing=$(gh issue list --state all --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            url='https://straggler-liu.github.io/mfg-stack-lab/'
            issue_url=$(gh issue create --title "$title" --body "The site audit and GitHub Pages deployment completed successfully. Public URL: $url")
            issue_number=${issue_url##*/}
            gh issue close "$issue_number" --reason completed
          fi

  report-failure:
    if: always() && (needs.validate.result == 'failure' || needs.deploy.result == 'failure')
    needs: [validate, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Open or update deployment incident
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title='[Automation] GitHub Pages deployment failed'
          body=$(cat <<'EOF'
          The MFG Stack Lab deployment workflow failed.

          Check the latest **Deploy static site to GitHub Pages** workflow run. The explicit Pages artifact requires the buyer acquisition tools, seller/advisor pages, nested service/model assets and Google Search Console verification file to exist before deployment can proceed.
          EOF
          )
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Deployment failed again on $(date -u +%F)."
          else
            gh issue create --title "$title" --body "$body"
          fi
