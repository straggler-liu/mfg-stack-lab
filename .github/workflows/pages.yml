name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run local site audit
        run: python scripts/site_audit.py

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  report-success:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Record first successful deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='[Automation] Initial GitHub Pages deployment succeeded'
          existing=$(gh issue list --state all --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            url='https://straggler-liu.github.io/mfg-stack-lab/'
            issue_url=$(gh issue create --title "$title" --body "The site audit and GitHub Pages deployment completed successfully. Public URL: $url")
            issue_number=${issue_url##*/}
            gh issue close "$issue_number" --reason completed
          fi

  report-failure:
    if: always() && (needs.validate.result == 'failure' || needs.deploy.result == 'failure')
    needs: [validate, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Open or update deployment incident
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='[Automation] GitHub Pages deployment failed'
          body=$(cat <<'EOF'
          The MFG Stack Lab deployment workflow failed.

          Check the latest **Deploy static site to GitHub Pages** workflow run. The common first-launch cause is that repository **Settings → Pages → Build and deployment → Source** is not yet set to **GitHub Actions**. Other causes include a failed site audit or a Pages permission error.
          EOF
          )
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Deployment failed again on $(date -u +%F)."
          else
            gh issue create --title "$title" --body "$body"
          fi
